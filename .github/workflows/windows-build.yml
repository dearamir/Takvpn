name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-client-foundation
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64
        run: dotnet publish windows/TakVPN.Windows/TakVPN.Windows.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakVPN-Windows-x64-preview
          path: windows/TakVPN.Windows/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
