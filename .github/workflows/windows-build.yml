name: Windows desktop build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  push:
    branches:
      - main
      - feature/windows-client-foundation
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download official Xray core and Wintun
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/XTLS/Xray-core/releases/latest" -Headers @{ "User-Agent" = "TakVPN-Windows-CI" }
          $asset = $release.assets | Where-Object { $_.name -eq "Xray-windows-64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "Official Xray release does not contain Xray-windows-64.zip" }
          New-Item -ItemType Directory -Force -Path "windows/TakVPN.Windows/tools/xray" | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "xray-windows-64.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if ($asset.digest -and $asset.digest.StartsWith("sha256:")) {
            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = $asset.digest.Substring(7).ToLowerInvariant()
            if ($actual -ne $expected) { throw "Xray archive SHA-256 mismatch" }
          }
          $extract = Join-Path $env:RUNNER_TEMP "xray-extract"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $xray = Get-ChildItem $extract -Filter "xray.exe" -Recurse | Select-Object -First 1
          $wintun = Get-ChildItem $extract -Filter "wintun.dll" -Recurse | Select-Object -First 1
          if (-not $xray -or -not $wintun) { throw "Xray or Wintun binary missing from official release archive" }
          Copy-Item $xray.FullName "windows/TakVPN.Windows/tools/xray/xray.exe" -Force
          Copy-Item $wintun.FullName "windows/TakVPN.Windows/tools/xray/wintun.dll" -Force
          Get-ChildItem $extract -File | Where-Object { $_.Name -match "^(geoip|geosite).*\.dat$|^LICENSE" } | ForEach-Object { Copy-Item $_.FullName "windows/TakVPN.Windows/tools/xray/$($_.Name)" -Force }

      - name: Publish self-contained Windows x64 app
        run: dotnet publish windows/TakVPN.Windows/TakVPN.Windows.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Smoke test bundled Xray
        shell: pwsh
        run: |
          $core = "windows/TakVPN.Windows/tools/xray/xray.exe"
          & $core version
          if ($LASTEXITCODE -ne 0) { throw "Xray binary smoke test failed" }

      - name: Bundle Xray and Wintun
        shell: pwsh
        run: |
          $publish = "windows/TakVPN.Windows/bin/Release/net8.0-windows/win-x64/publish"
          $tools = Join-Path $publish "tools/xray"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item "windows/TakVPN.Windows/tools/xray/*" $tools -Recurse -Force

      - name: Create installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler not found in standard installation paths" }
          & $iscc "windows/installer/TakVPN.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          Copy-Item "TakVPN-Setup-x64.exe" "TakVPN-Windows-x64-preview.exe"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $publish = "windows/TakVPN.Windows/bin/Release/net8.0-windows/win-x64/publish"
          Compress-Archive -Path "$publish/*" -DestinationPath "TakVPN-Windows-x64-portable.zip" -Force

      - name: Upload Windows installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: TakVPN-Windows-x64-preview
          path: |
            TakVPN-Windows-x64-preview.exe
            TakVPN-Windows-x64-portable.zip
          if-no-files-found: error

      - name: Publish Windows assets to the latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releases = gh release list --limit 20 --json tagName,isDraft,isPrerelease,publishedAt | ConvertFrom-Json
          $target = $releases | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -match '^v[0-9]+[.][0-9]+([.][0-9]+)?$' } | Sort-Object { [DateTimeOffset]$_.publishedAt } -Descending | Select-Object -First 1
          if (-not $target) { throw "No published Android version release found; refusing to create a separate release." }
          $tag = $target.tagName
          Write-Host "Publishing Windows assets to latest release: $tag"
          gh release upload $tag "TakVPN-Windows-x64-preview.exe" "TakVPN-Windows-x64-portable.zip" --clobber
