name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XRAY_CORE_VERSION: "26.11.9"
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Xray core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download "v$XRAY_CORE_VERSION" --repo 2dust/AndroidLibXrayLite --pattern "libv2ray.aar" --dir app/libs
          ls -la app/libs

      - name: Prepare signing key
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD not set; Gradle will use the debug signing config for the release build"
            exit 0
          fi

          if [ -f release.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -in release.keystore.enc -out release.keystore -pass env:KEYSTORE_PASSWORD
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            keytool -genkeypair -keystore release.keystore -alias takvpn -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 8000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Takvpn"
            openssl enc -aes-256-cbc -pbkdf2 -md sha256 -salt -in release.keystore -out release.keystore.enc -pass env:KEYSTORE_PASSWORD
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add release.keystore.enc
            git commit -m "Add encrypted signing key"
            git push
          else
            echo "Encrypted release key is missing; creating a temporary key for this test build"
            keytool -genkeypair -keystore release.keystore -alias takvpn -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 8000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Takvpn"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release view --repo dearamir/Takvpn --json tagName --jq '.tagName')
          CURRENT_VERSION="${LATEST_TAG#v}"
          MAJOR="${CURRENT_VERSION%%.*}"
          MINOR="${CURRENT_VERSION#*.}"
          if [ "$MINOR" -ge 99 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          else
            MINOR=$((MINOR + 1))
          fi
          APP_VERSION="$MAJOR.$(printf "%02d" "$MINOR")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building Takvpn $APP_VERSION"
          gradle :app:assembleRelease :app:assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=$APP_VERSION -PxrayCoreVersion=$XRAY_CORE_VERSION

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Takvpn-APKs-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$APP_VERSION"
          for APK in app/build/outputs/apk/release/*.apk; do
            BASE=$(basename "$APK")
            case "$BASE" in
              *arm64-v8a*) ABI="arm64-v8a" ;;
              *armeabi-v7a*) ABI="armeabi-v7a" ;;
              *universal*) ABI="universal" ;;
              *) ABI="release" ;;
            esac
            cp "$APK" "Takvpn-v$V-$ABI.apk"
          done
          gh release create "v$V" Takvpn-v"$V"-*.apk --title "Takvpn $V" --notes "Takvpn version $V - ARM64, ARMv7 and Universal APKs" --latest
