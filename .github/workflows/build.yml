name: Build APK
# Push commits containing [release] publish signed APKs as a GitHub Release.
# The release job signs APKs with the repository encrypted keystore secret.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Build and publish a signed Release APK"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XRAY_CORE_VERSION: "26.11.9"
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Xray core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download "v$XRAY_CORE_VERSION" --repo 2dust/AndroidLibXrayLite --pattern "libv2ray.aar" --dir app/libs
          ls -la app/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs
        run: |
          gradle :app:assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }} -PxrayCoreVersion=$XRAY_CORE_VERSION

      - name: Prepare signing key for release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret is required for release signing"; exit 1; }
          test -f release.keystore.enc || { echo "Encrypted release keystore is missing"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -in release.keystore.enc -out release.keystore -pass env:KEYSTORE_PASSWORD

      - name: Build signed Release APKs
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh release list --repo dearamir/Takvpn --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$LATEST_TAG" ]; then
            APP_VERSION="1.00"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
            MAJOR="${CURRENT_VERSION%%.*}"
            MINOR="${CURRENT_VERSION#*.}"
            # Release tags use zero-padded decimals (for example 2.08).
            # Force base 10 so Bash does not parse 08 as an invalid octal number.
            MINOR=$((10#$MINOR))
            if [ "$MINOR" -ge 99 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            else
              MINOR=$((MINOR + 1))
            fi
            APP_VERSION="$MAJOR.$(printf "%02d" "$MINOR")"
          fi
          echo "Release version: $APP_VERSION"
          gradle :app:assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=$APP_VERSION -PxrayCoreVersion=$XRAY_CORE_VERSION
          mkdir -p release-assets
          for APK in app/build/outputs/apk/release/*.apk; do
            BASE=$(basename "$APK")
            case "$BASE" in
              *arm64-v8a*) ABI="arm64-v8a" ;;
              *armeabi-v7a*) ABI="armeabi-v7a" ;;
              *universal*) ABI="universal" ;;
              *) ABI="release" ;;
            esac
            cp "$APK" "release-assets/Takvpn-v$APP_VERSION-$ABI.apk"
          done
          echo "$APP_VERSION" > release-assets/release-version.txt
          ls -la release-assets

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Takvpn-Debug-APKs-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APKs and version
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: Takvpn-Release-APKs-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release APKs and version
        uses: actions/download-artifact@v4
        with:
          name: Takvpn-Release-APKs-${{ github.run_number }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(cat release-assets/release-version.txt)
          ls -la release-assets
          gh release create "v$VERSION" release-assets/Takvpn-v"$VERSION"-*.apk --title "Takvpn $VERSION" --generate-notes --latest
